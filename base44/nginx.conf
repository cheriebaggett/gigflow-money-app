# Minimal nginx config for the Base44 sandbox preview.
# The repo is bind-mounted at /usr/share/nginx/html; the sandbox checkout can be
# mode 0700 for root, so nginx worker processes run as root here to read it.
user root;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
