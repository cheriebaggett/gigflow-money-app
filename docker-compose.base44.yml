services:
  web:
    image: nginx:alpine
    restart: on-failure
    labels:
      base44.project: Gigflow Money App
      base44.kind: web
      base44.port: 3000
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./base44/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
